<text x="474" y="195" fill="#ffffff" font-family="Georgia,serif" font-size="34" font-style="italic">Es preciso ser duro,</text>
<text x="474" y="247" fill="#ffffff" font-family="Georgia,serif" font-size="34" font-style="italic">pero sin perder la ternura jamás.</text>
