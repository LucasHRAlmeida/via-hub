name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Contrato da Escala Movel
        run: node tests/escala-movel.test.cjs
      - name: Conversor EVAM
        working-directory: regulacao-federal-ia/evam
        run: npm test
