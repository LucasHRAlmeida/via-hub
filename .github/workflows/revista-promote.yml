name: Revista VIA - promover edição

on:
  push:
    branches: [main]
    paths:
      - 'revista/edicao-*.md'
      - 'revista/.promote'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/revista-promote.yml'
      - 'scripts/revista/**'
      - 'revista/edicao-*.md'
      - 'revista/index.html'
      - 'revista/arquivo/**'
      - 'revista/*.pdf'
      - 'revista/README.md'
      - 'sitemap.xml'
      - 'llms.txt'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Data da edição (YYYY-MM-DD); vazio = edição Markdown mais recente'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: revista-via-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolver edição e estado corrente
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '<!-- REVISTA_PUBLICATION_PAUSED -->' revista/index.html; then
            node scripts/revista/promote.mjs --check
            if node scripts/revista/promote.mjs --edition 2099-01-01; then
              echo 'ERRO: promoção permitida durante suspensão'
              exit 1
            fi
            git diff --exit-code -- revista/index.html
            echo 'noop=true' >> "$GITHUB_OUTPUT"
            echo 'paused=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          INPUT_EDITION='${{ github.event.inputs.edition || '' }}'
          if [[ -n "$INPUT_EDITION" ]]; then
            EDITION="$INPUT_EDITION"
          else
            LATEST=$(find revista -maxdepth 1 -type f -name 'edicao-????-??-??.md' | sort | tail -n 1)
            test -n "$LATEST"
            EDITION=$(basename "$LATEST" | sed -E 's/^edicao-([0-9]{4}-[0-9]{2}-[0-9]{2})\.md$/\1/')
          fi
          [[ "$EDITION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test -f "revista/edicao-${EDITION}.md"

          CURRENT=$(grep -oE '"dateModified"[[:space:]]*:[[:space:]]*"[0-9]{4}-[0-9]{2}-[0-9]{2}"' revista/index.html | head -n 1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          test -n "$CURRENT"

          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [[ "$CURRENT" == "$EDITION" ]]; then
            echo 'noop=true' >> "$GITHUB_OUTPUT"
          else
            echo 'noop=false' >> "$GITHUB_OUTPUT"
          fi
          echo "Publicada: $CURRENT | Candidata: $EDITION"

      - name: Arquivar edição publicada em PDF A4
        if: steps.state.outputs.noop == 'false'
        shell: bash
        env:
          CURRENT: ${{ steps.state.outputs.current }}
        run: |
          set -euo pipefail
          DEST="revista/arquivo/${CURRENT}.pdf"
          if [[ -s "$DEST" ]]; then
            echo "Arquivo já existe: $DEST"
            exit 0
          fi
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          test -n "$CHROME"
          TMP=$(mktemp --suffix=.html)
          sed 's#</head>#<style>@page{size:A4;margin:12mm} body{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head>#' revista/index.html > "$TMP"
          "$CHROME" --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf="$DEST" "file://${TMP}"
          rm -f "$TMP"
          test -s "$DEST"

      - name: Promover fonte Markdown para o HTML canônico
        if: steps.state.outputs.noop == 'false'
        env:
          EDITION: ${{ steps.state.outputs.edition }}
        run: |
          node scripts/revista/promote.mjs --edition "$EDITION"
          sed -i 's/[[:space:]]\+$//' revista/index.html

      - name: QA da edição promovida
        if: steps.state.outputs.paused != 'true'
        env:
          EDITION: ${{ steps.state.outputs.edition }}
        run: |
          set -euo pipefail
          node scripts/revista/promote.mjs --edition "$EDITION" --check
          node --check scripts/revista/promote.mjs
          git diff --check
          grep -q "Edição de" revista/index.html
          grep -q "PANORAMA:START" revista/index.html
          grep -q "PANORAMA:END" revista/index.html
          if [[ "${{ steps.state.outputs.noop }}" == "false" ]]; then
            test -s "revista/arquivo/${{ steps.state.outputs.current }}.pdf"
          fi

      - name: Commit da promoção
        if: steps.state.outputs.noop == 'false' && github.event_name != 'pull_request'
        shell: bash
        env:
          EDITION: ${{ steps.state.outputs.edition }}
          CURRENT: ${{ steps.state.outputs.current }}
        run: |
          set -euo pipefail
          git config user.name 'via-revista-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revista/index.html "revista/arquivo/${CURRENT}.pdf"
          if git diff --cached --quiet; then
            echo 'Nada a publicar.'
            exit 0
          fi
          git commit -m "Revista: promove ${EDITION} e arquiva ${CURRENT}"
          git push origin HEAD:main

  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar edição, HTML, links, rotas e PDFs
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '<!-- REVISTA_PUBLICATION_PAUSED -->' revista/index.html; then
            echo 'PR candidata não pode manter a página suspensa.'
            exit 1
          fi
          EDITION=$(find revista -maxdepth 1 -type f -name 'edicao-????-??-??.md' | sort | tail -n 1)
          test -n "$EDITION"
          EDITION=$(basename "$EDITION" | sed -E 's/^edicao-([0-9]{4}-[0-9]{2}-[0-9]{2})\.md$/\1/')
          export EDITION
          node scripts/revista/promote.mjs --edition "$EDITION"
          sed -i 's/[[:space:]]\+$//' revista/index.html
          node scripts/revista/promote.mjs --edition "$EDITION" --check
          node --check scripts/revista/promote.mjs
          git diff --exit-code -- revista/index.html
          git diff --check
          grep -q "datePublished.*$EDITION" revista/index.html
          grep -q "dateModified.*$EDITION" revista/index.html
          grep -q 'href="https://iniciativa-via.com/via-hub/revista/"' revista/index.html
          test -s "revista/edicao-$EDITION.pdf"
          test -s "revista/arquivo/2026-10-25.pdf"
          test -s "revista/arquivo/especial-2026-10-04.pdf"
          test ! -e revista/especial-2026-10-04.html
          test ! -e revista/especial-2026-10-04.pdf
          test ! -e revista/especial-parar-fonts.css
          ! grep -R -n --include='*.md' --include='*.html' --include='*.xml' --include='*.txt' 'revista/especial-2026-10-04.html' --exclude-dir=.git .
          ! grep -q 'revista/especial-2026-10-04.html' sitemap.xml
          ! grep -q 'revista/especial-2026-10-04.html' llms.txt
          grep -q 'https://iniciativa-via.com/via-hub/revista/' sitemap.xml
          test "$(grep -c '<loc>https://iniciativa-via.com/via-hub/revista/</loc>' sitemap.xml)" -eq 1
          node - <<'NODE'
          const fs=require('fs');
          const md=fs.readFileSync('revista/edicao-'+process.env.EDITION+'.md','utf8');
          const html=fs.readFileSync('revista/index.html','utf8');
          const urls=[...md.matchAll(/\]\((https?:\/\/[^)]+)\)/g)].map(m=>m[1]);
          for(const u of urls){try{new URL(u)}catch{throw new Error('URL inválida: '+u)}}
          const ids=new Set([...html.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]));
          const anchors=[...html.matchAll(/href="#([^"]+)"/g)].map(m=>m[1]);
          const broken=anchors.filter(a=>!ids.has(a));
          if(broken.length)throw new Error('Âncoras internas quebradas: '+broken.join(', '));
          if(urls.length<10)throw new Error('Poucas fontes/links: '+urls.length);
          NODE
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          for PDF in "revista/arquivo/2026-10-25.pdf" "revista/edicao-$EDITION.pdf"; do
            pdfinfo "$PDF" > /tmp/pdfinfo.txt
            grep -q '(A4)' /tmp/pdfinfo.txt
            pdftotext "$PDF" - > /tmp/pdftext.txt
            test -s /tmp/pdftext.txt
          done
          pdftotext "revista/edicao-$EDITION.pdf" - | grep -q 'DNA-HPV'
          pdftotext "revista/edicao-$EDITION.pdf" - | grep -q 'Bundibugyo'
          pdftotext "revista/arquivo/2026-10-25.pdf" - | grep -q 'Farmácia Popular'
